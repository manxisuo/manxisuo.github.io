<article class="garden-post-card">
    <div class="post-card-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time><span>{{ .ReadingTime }} 分钟阅读</span></div>
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <p class="post-card-summary">{{ with .Description }}{{ . | plainify | htmlUnescape | truncate 110 }}{{ else }}{{ .Summary | plainify | htmlUnescape | truncate 110 }}{{ end }}</p>
    <div class="post-card-footer"><div class="post-card-tags">{{ range first 2 (.GetTerms "tags") }}<a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}</div><a class="post-card-arrow" href="{{ .RelPermalink }}" aria-label="阅读：{{ .Title }}">↗</a></div>
</article>
