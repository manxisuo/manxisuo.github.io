baseURL = "https://manxisuo.github.io/"
languageCode = "zh-cn"
title = "Manxisuo的博客"
theme = "Stack"

# 是否包括中日韩文字
hasCJKLanguage = true

# 默认内容语言
DefaultContentLanguage = "zh-cn"

[params]
  # 主要内容区域
  mainSections = ["posts"]
  
  # SEO: 网站描述
  description = "Manxisuo的技术博客 - 记录技术学习、生活感悟和思考"
  
  # SEO: 关键词
  keywords = ["技术博客", "编程", "JavaScript", "Python", "C++", "学习笔记"]
  
  # RSS 全文内容
  rssFullContent = true
  
  # Favicon 配置（将 favicon 文件放在 static/ 目录下，路径必须以 / 开头）
  favicon = "/favicon.svg"
  
  # 页脚配置
  [params.footer]
    since = 2010
    customText = ""
  
  # 日期格式
  [params.dateFormat]
    published = "2006-01-02"
    lastUpdated = "2006-01-02 15:04 MST"
  
  # 侧边栏配置
  [params.sidebar]
    emoji = "📝"
    subtitle = "在复杂世界中，保持探索与思考的耐心。"
    [params.sidebar.avatar]
      enabled = false
      local = true
      src = ""
  
  # 文章配置
  [params.article]
    math = false
    toc = true
    readingTime = true
    [params.article.license]
      enabled = true
      default = "Licensed under CC BY-NC-SA 4.0"
  
  # 评论配置
  [params.comments]
    enabled = true
    provider = "giscus"
    
    # Giscus 配置（基于 GitHub Discussions）
    # 设置步骤：
    # 1. 在 GitHub 仓库中启用 Discussions（Settings -> Features -> Discussions）
    # 2. 访问 https://giscus.app 配置并获取以下参数
    # 3. 安装 Giscus app 到你的仓库
    [params.comments.giscus]
      repo = "manxisuo/manxisuo.github.io"  # 格式：用户名/仓库名
      repoID = "R_kgDOQ0uWTA"  # 从 giscus.app 获取
      category = "Announcements"  # Discussions 分类名称
      categoryID = "DIC_kwDOQ0uWTM4C1Myu"  # 从 giscus.app 获取
      mapping = "pathname"  # 映射方式：pathname, url, title, og:title
      strict = 0  # 严格模式：0 或 1
      reactionsEnabled = 1  # 启用反应：0 或 1
      emitMetadata = 0  # 发出元数据：0 或 1
      inputPosition = "bottom"  # 输入框位置：top 或 bottom
      lang = "zh-CN"  # 语言
      lightTheme = "light"  # 浅色主题
      darkTheme = "dark_dimmed"  # 深色主题
  
  # 颜色方案
  [params.colorScheme]
    toggle = true
    default = "auto"
  
  # Widgets 配置（侧边栏组件）
  [params.widgets]
    # 首页/列表页右侧边栏
    homepage = [
      { type = "search" },              # 搜索框
      { type = "archives", params = { limit = 5 } },  # 最近归档（显示5条）
      { type = "tag-cloud", params = { limit = 10 } }  # 标签云（显示10个）
    ]
    
    # 文章页面右侧边栏：显示目录
    page = [
      { type = "toc" }
    ]

[outputs]
  home = ["HTML", "RSS"]

[pagination]
  pagerSize = 8

[menu]
  [[menu.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 5
    [menu.main.params]
      icon = "home"

  # 主导航菜单
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
    [menu.main.params]
      icon = "home"
  
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 20
    [menu.main.params]
      icon = "tag"
  
  # 社交链接菜单
  [[menu.social]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/manxisuo"
    weight = 10
    [menu.social.params]
      icon = "brand-github"
  
  [[menu.social]]
    identifier = "zhihu"
    name = "知乎"
    url = "https://www.zhihu.com/people/suyun"
    weight = 20
    [menu.social.params]
      icon = "brand-zhihu"
  
  [[menu.social]]
    identifier = "segmentfault"
    name = "SegmentFault"
    url = "https://segmentfault.com/u/manxisuo"
    weight = 30
    [menu.social.params]
      icon = "brand-segmentfault"
  
  [[menu.social]]
    identifier = "email"
    name = "Email"
    url = "mailto:manxisuo@gmail.com"
    weight = 40
    [menu.social.params]
      icon = "brand-email"